<style>body{margin:0;font-family:Arial}h1{margin:unset;font-size:1.8em}#information{z-index:1000;color:#fff;position:absolute;top:.5rem;left:1rem}#search{z-index:1000;color:#fff;position:absolute;bottom:.5rem;left:1rem}</style><script src=//cdn.jsdelivr.net/npm/3d-force-graph></script><body>
  <div id=3d-graph></div>

  <div id=information>
    <h1>OER Schlüsselwortsuche</h1>
    <span id=nodes>0</span> Knoten, <span id=edges>0</span> Kanten
  </div>

  <div id=search>
    <input id=search-input>
  </div>

  <div id=info-panel-container style=z-index:1500;flex-direction:column-reverse;align-items:flex-end;gap:.7em;display:flex;position:absolute;bottom:.5rem;right:1rem>
    <details id=beschreibung-panel style="color:#fff;background:#1e1e1e80;border-radius:8px;width:280px;padding:1em 1.5em;box-shadow:0 2px 8px #0008">
      <summary style=cursor:pointer;align-items:center;gap:.5em;font-size:1.1em;display:flex>
        <svg xmlns:xmlns=http://www.w3.org/2000/svg width=1em height=1em fill=currentColor stroke=currentColor stroke-width=0 viewBox="0 0 16 16"><path stroke=none d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/><path stroke=none d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533ZM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/></svg>
        Beschreibung
      </summary>
      <div style=margin-top:.7em>
        <p>
          Diese Karte zeigt das <i>Netzwerk</i> aller OER-Inhalte des
          sächsischen OPAL-Systems. Jeder <i>Knoten</i> stellt einen OER-Inhalt
          dar und jede Kante eine Ähnlichkeitsbeziehung zwischen den Beiträgen.
        </p>
      </div>
    </details>

    <div id=node-info style="color:#fff;z-index:2000;background:#1e1e1e80;border-radius:8px;width:280px;max-width:300px;max-height:40vh;padding:1em 1.5em;display:none;overflow:scroll;box-shadow:0 2px 8px #0008">
      <button id=close-node-info style="color:#fff;cursor:pointer;z-index:10;background:0 0;border:none;font-size:1.2em;position:absolute;top:.5em;right:.5em" aria-label=Schließen title=Schließen>
        ×
      </button>

      <div id=node-info-text></div>
    </div>
  </div>

  <script>function resetNodePositions(e){return e.map(({x:e,y:o,z:n,vx:a,vy:i,vz:d,fx:l,fy:r,fz:s,...u})=>({...u,x:void 0,y:void 0,z:void 0,vx:void 0,vy:void 0,vz:void 0,fx:void 0,fy:void 0,fz:void 0}))}function showNodeInfo(e){let o=document.getElementById("node-info-text");if(!e)return;let n="",a="";e.affiliation&&(n=`<i style="display: block; margin-top: 0.5rem">(${e.affiliation})</i>`),e.file&&(a="<br>Typ: "+e.file),o.parentElement.style.display="block",o.innerHTML=`
        <strong>${e.title}</strong>
        ${n}
        <ul>
          ${(e.tag||[]).map(e=>`<li>${e}</li>`).join("")}
        </ul>
        <a href="https://bildungsportal.sachsen.de/opal/oer/${e.id}" target="_blank" style="color:#6cf;text-decoration:underline; margin-bottom: 0.5rem">
          Zum OER-Eintrag
        </a>
        ${a}
      `}function includes(e,o){for(t of(e=e.toLowerCase(),o=o.toLowerCase().split(" ")))if(!e.includes(t))return!1;return!0}function handleSearch(e){let o=e.target.value.toLowerCase();if(!database||!Graph)return;if(!o){Graph.graphData(database).d3ReheatSimulation(),updateCounters(database);return}let n=new Set(database.nodes.filter(e=>includes(e.title+" "+e.affiliation+" "+e.file+e.tag.join(" "),o)).map(e=>e.id)),a=database.links.filter(e=>n.has(e.source.id)||n.has(e.target.id)).map(e=>({source:e.source.id,target:e.target.id})),i=resetNodePositions(database.nodes.filter(e=>n.has(e.id)||a.some(o=>o.source===e.id||o.target===e.id)));Graph.graphData({nodes:i,links:a}).cooldownTicks(100).d3ReheatSimulation().zoomToFit(600,40),updateCounters({nodes:i,links:a})}function updateCounters(e){document.getElementById("nodes").innerText=e.nodes.length,document.getElementById("edges").innerText=e.links.length}let elem=document.getElementById("3d-graph"),database=null,Graph=null;fetch("db.json").then(e=>e.json()).then(e=>{updateCounters(database=e),Graph=new ForceGraph3D(elem).graphData(database).nodeAutoColorBy(e=>e.tag[0]).nodeLabel(e=>`${e.title}`).onNodeClick(e=>window.open(`https://bildungsportal.sachsen.de/opal/oer/${e.id}`,"_blank")).onNodeHover(showNodeInfo).onNodeRightClick(showNodeInfo)}).catch(e=>{console.warn(e)});let debounce=(e,o=200)=>{let n;return(...a)=>{clearTimeout(n),n=setTimeout(()=>e(...a),o)}};document.getElementById("search-input").addEventListener("input",debounce(handleSearch,250)),document.getElementById("close-node-info").onclick=function(){document.getElementById("node-info").style.display="none"};</script>
