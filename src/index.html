<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OER-Graph</title>

    <script src="npm:3d-force-graph/dist/3d-force-graph.min.js"></script>
    <script type="module" src="index.ts"></script>

    <link rel="stylesheet" href="npm:vuetify/dist/vuetify.min.css" />
    <link rel="stylesheet" href="npm:@mdi/font/css/materialdesignicons.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        overscroll-behavior-y: none;
      }

      body {
        position: relative;
        touch-action: manipulation;
      }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          let sw = './sw.js'
          try {
            navigator.serviceWorker
              .register(sw)
              .then(console.log)
              .catch(console.error)
          } catch (e) {
            console.warn('sw: ', e)
          }
        })
      }
    </script>

    <link rel="shortcut icon" sizes="192x192" href="../assets/logo_192.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Lia" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="LiaScript" />
    <meta name="msapplication-TileImage" content="../assets/logo_512.png" />
    <meta name="msapplication-TileColor" content="#0071c5" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#000000" />

    <meta
      name="description"
      content="Suche verknüpfte OER Dokumente im sächsischen OPAL"
    />

    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Favicons -->
    <link rel="apple-touch-icon" href="../assets/logo_192.png" />
    <link rel="icon" href="../assets/logo_192.png" type="image/png" />
  </head>
  <body></body>
</html>
